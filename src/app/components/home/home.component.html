@if (isAnimationInProgress && !isActive('/about-us')) {
  <div class="loading-container" [@fadeOut]="true">
    <pw-loading></pw-loading>
  </div>
}
@if (!isAnimationInProgress) {
  <header [@fadeIn]>
    <nav>
      <div class = "bar" >
        <a href="#" class="logo"><img src="../../../assets/ImageAsset/dewchan-white.png"
        alt="Logo"></a>
        @if (!menu) {
          <fa-icon class = "hamburgerBar" (click)="toggleMenu()" [icon]="faBars" size="2x" [@fadeIn]></fa-icon>
        }
        @if (menu) {
          <fa-icon class="Xmark" (click)="closeMenu()" [icon]="faXmark" size="2x" [@fadeIn]></fa-icon>
        }
      </div>
      <!-- <nav> -->
        @if (menu) {
          <ul [@fadeIn] [@slideLeftRight] data-animation-order="fadeIn,slideLeftRight">
          <li><a routerLink="/" (click)="scrollToHome()"
          [class.active]="isHomeRoute() && activeSection === ''" >Home</a></li>
          <li><a (click)="scrollToEvent()" [class.active]="activeSection === 'event-details'">About Me</a></li>
          <li><a (click)="scrollToFAQ()" [class.active]="activeSection === 'faq'">Tech Stacks</a></li>
          <li><a (click)="scrollToRules()" [class.active]="activeSection === 'rules'">Projects</a></li>
          <li><a (click)="scrollToPrizes()" [class.active]="activeSection === 'prizes'">Contact</a></li>
          <li>@if (menu) {
            <a href="http://www.linkedin.com/in/de-wei-chan/" target="_blank" class="btn" (click)="closeMenu()">Connect Now</a>
          }</li>
        </ul>
      }
    </nav>
  </header>
}

<pw-banner></pw-banner>
<pw-event-details id='event-details'></pw-event-details>
<pw-faq id='faq'></pw-faq>
<pw-rules id='rules'></pw-rules>
<pw-prizes id='prizes'></pw-prizes>
