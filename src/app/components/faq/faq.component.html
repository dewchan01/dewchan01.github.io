<section class="faq" [style.boxShadow]="boxShadow">
  <h1 [innerHTML]="techStacks"></h1>

  <div class="faq-container" #container>
    <div class="flow-line">
      <pw-circuit-svg></pw-circuit-svg>
    </div>
    <ol class="faq-list">
      @for (question of faq; track question; let i = $index) {
        <li class="no-bullet">
          <div>
            <div class="question">
              @if (question.showAnswer) {
                <fa-icon class="power-off" (click)="question.showAnswer = false"
                [icon]="faPowerOff"></fa-icon>
              }
              @if (!question.showAnswer) {
                <fa-icon class="power-on" (click)="question.showAnswer = true"
                [icon]="faCircleNotch"></fa-icon>
              }
              <div class="text">
                <h2 (click)="question.showAnswer = !question.showAnswer">
                  {{question.question}}
                </h2>
                <div class="answer-container" [@toggleAnswer]="question.showAnswer ? 'visible' : 'hidden'">
                  @for (imgUrl of question.answer; track imgUrl) {
                    <img [src]="imgUrl">
                  }
                </div>
              </div>
            </div>
          </div>
        </li>
      }
    </ol>

  </div>
</section>
